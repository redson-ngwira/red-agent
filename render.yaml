services:
  - type: web
    name: red-agent
    env: node
    plan: starter
    # Render injects $PORT automatically; harness now defaults to 0.0.0.0:$PORT
    # when PORT is set (see packages/bundle/web-app/cordis.patch.yml).
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm red web --no-open
    healthCheckPath: /
    disk:
      name: dsh-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: DSH_HOME
        value: /data/.dsh
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DSH_PERMISSION_MODE
        value: read-only
      - key: DSH_TELEMETRY_DISABLED
        value: 1
      - key: RED_AGENT_PASSWORD
        sync: false
        value: red
      # Optional: uncomment to force all-interfaces even without $PORT
      # - key: DSH_HOST
      #   value: 0.0.0.0
